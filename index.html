<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Enter — Yousif Is Here</title>
  <meta name="description" content="Enter the world of Yousif Is Here.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --text-gradient: linear-gradient(90deg, #36d8ff, #fff0c4 50%, #ff554d); }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      background: #080808 url("cover-background.png") center / cover no-repeat fixed;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background: linear-gradient(180deg, rgba(5,5,5,.25), rgba(5,5,5,.62));
    }
    main {
      position: relative; min-height: 100vh; padding: 24px;
      display: grid; place-content: center; justify-items: center; gap: 30px;
      text-align: center;
    }
    .entry-content { transform: translateY(clamp(40px, 8vh, 80px)); }
    h1 {
      margin: 0; color: #fff0c4; background: var(--text-gradient);
      font: 600 clamp(2.5rem, 8vw, 6rem)/1.1 "Cinzel", Georgia, serif;
      letter-spacing: .06em; text-shadow: 0 3px 22px #000;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .enter-link {
      display: inline-block; position: relative; top: 24px; padding: 15px 32px;
      border: 1px solid rgba(229,194,123,.9); border-radius: 2px;
      color: #fff0c4; background: rgba(9,8,7,.35);
      font: 600 1rem/1.2 "Cinzel", Georgia, serif;
      letter-spacing: .16em; text-decoration: none; text-transform: uppercase;
      background-image: var(--text-gradient);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      transition: background .2s ease, transform .2s ease;
    }
    .enter-link:hover, .enter-link:focus-visible {
      background-color: rgba(229,194,123,.2); transform: translateY(-2px);
      outline: 2px solid #fff0c4; outline-offset: 4px;
    }
    @media (min-width: 601px) {
      h1 {
        background-image: linear-gradient(180deg, #07131d 0%, #51dfff 14%, #e8fbff 23%, #0879b8 34%, #171b24 44%, #fff 50%, #581c25 62%, #ff514b 74%, #fff 82%, #301012 100%);
        text-shadow: 0 3px 22px #000, 0 0 18px rgba(27,190,255,.62), 0 0 22px rgba(255,54,49,.55);
      }
    }
    @media (max-width: 600px) {
      body {
        min-height: 100svh; background-color: #000;
        background-image: url("mobile.png"); background-position: center;
        background-repeat: no-repeat; background-attachment: scroll;
      }
      body::before {
        background:
          radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.72) 84%, #000 100%),
          linear-gradient(180deg, rgba(5,5,5,.25), rgba(5,5,5,.62));
      }
      main { min-height: 100svh; }
      .entry-content { transform: translateY(14vh); }
      h1 { display: none; }
      .enter-link {
        top: 0; border: 0; padding: 15px 32px;
        color: #fff; background-color: transparent; background-image: linear-gradient(180deg, #777 0%, #fff 24%, #999 48%, #f5f5f5 62%, #666 100%);
        font-size: 1.5rem; -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; box-shadow: none;
      }
      .enter-link:hover, .enter-link:focus-visible {
        background-color: transparent; outline-color: #000;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .enter-link { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="entry-content">
      <h1>Yousif Is Here</h1>
      <a class="enter-link" href="home.html">Enter Here</a>
    </div>
  </main>
</body>
</html>
